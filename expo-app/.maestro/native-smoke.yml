appId: ${MAESTRO_APP_ID}
name: Drops isolated-account persistence smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Login to your account"
    timeout: 60000
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::login-visible")}
- tapOn: "Email"
- inputText:
    text: ${MAESTRO_EMAIL}
    label: Enter isolated fixture email
- tapOn: "Password"
- inputText:
    text: ${MAESTRO_PASSWORD}
    label: Enter isolated fixture password
- hideKeyboard
- tapOn: "Login"
- extendedWaitUntil:
    visible: "Your profile|Log intake"
    timeout: 60000
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::authenticated")}
- runFlow:
    when:
      visible: "Your profile"
    commands:
      - evalScript: ${console.log("DROPS_QA_CHECKPOINT::onboarding-start")}
      - tapOn: "Name"
      - inputText:
          text: ${MAESTRO_NAME}
          label: Enter isolated fixture display name only
      - evalScript: ${console.log("DROPS_QA_CHECKPOINT::name-entered")}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            text: "Continue"
          direction: DOWN
      - tapOn: "Continue"
      - evalScript: ${console.log("DROPS_QA_CHECKPOINT::profile-saved")}
- extendedWaitUntil:
    visible: "Log intake"
    timeout: 60000
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::home-ready")}
- tapOn: "History"
- assertVisible: "No entries in this range."
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::history-empty")}
- tapOn: "Supps"
- assertVisible: "Log intake"
- tapOn: "Insights"
- assertVisible: "Log intake"
- tapOn: "Home"
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::navigation-complete")}
- tapOn: "Log intake"
- tapOn: "Add 8 oz water"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Added Water.*8 oz"
    timeout: 30000
- tapOn: "Dismiss receipt"
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::water-added")}
- tapOn: "History"
- assertVisible: "Edit Water, 8 oz, .*"
- takeScreenshot: evidence/history-after-water8
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::history-recorded")}
- killApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Log intake"
    timeout: 60000
- assertNotVisible: "Login to your account"
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::relaunch-ready")}
- tapOn: "History"
- assertVisible: "Edit Water, 8 oz, .*"
- assertNotVisible: "No entries in this range."
- takeScreenshot: evidence/history-after-relaunch
- evalScript: ${console.log("DROPS_QA_CHECKPOINT::persistence-verified")}
- tapOn: "Home"
- takeScreenshot: evidence/home-after-relaunch
