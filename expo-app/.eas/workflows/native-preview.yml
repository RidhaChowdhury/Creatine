name: Drops native preview
# One branch owns the shared native preview channel. PRs get independent web previews.
on:
  push:
    branches: ['main']
  workflow_dispatch: {}
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}
defaults:
  tools:
    node: '22.23.3'
jobs:
  validate:
    environment: preview
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: node scripts/guard-preview.mjs
      - run: npm run verify
      - run: npm run build:native
  fingerprint:
    needs: [validate]
    type: fingerprint
    environment: preview
  find_ios:
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      channel: preview
      distribution: internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true
  find_android:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      channel: preview
      distribution: internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true
  build_ios:
    needs: [find_ios]
    if: ${{ !needs.find_ios.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
  build_android:
    needs: [find_android]
    if: ${{ !needs.find_android.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
  publish:
    after: [find_ios, find_android, build_ios, build_android]
    if: ${{ (after.find_ios.outputs.build_id || after.build_ios.outputs.build_id) && (after.find_android.outputs.build_id || after.build_android.outputs.build_id) }}
    type: update
    environment: preview
    env:
      EXPO_NO_DOTENV: '1'
    params:
      channel: preview
      platform: all
    hooks:
      before_update:
        - run: node scripts/guard-preview.mjs
  evidence:
    needs: [fingerprint, publish]
    after: [find_ios, find_android, build_ios, build_android]
    env:
      DROPS_ENV: preview
      DROPS_IOS_BUILD_ID: ${{ after.find_ios.outputs.build_id || after.build_ios.outputs.build_id }}
      DROPS_ANDROID_BUILD_ID: ${{ after.find_android.outputs.build_id || after.build_android.outputs.build_id }}
      DROPS_IOS_FINGERPRINT: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      DROPS_ANDROID_FINGERPRINT: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      DROPS_UPDATE_ID: ${{ needs.publish.outputs.first_update_group_id }}
    steps:
      - uses: eas/checkout
      - run: node scripts/release-manifest.mjs
      - uses: eas/upload_artifact
        with:
          path: artifacts
          name: native-release-evidence
          type: other
