name: Expo app CI

on:
  pull_request:
    paths: ['expo-app/**', '!expo-app/docs/**', '.github/workflows/ci.yml', '.easignore']
  push:
    branches: ['main']
    paths: ['expo-app/**', '!expo-app/docs/**', '.github/workflows/ci.yml', '.easignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drops-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-web:
    name: Verify and export web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: expo-app/.nvmrc
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install dependencies
        run: node scripts/retry-infrastructure.mjs -- npm ci

      - name: Check local Expo environment
        run: npm run doctor -- --local

      - name: Run verification suite
        run: npm run verify

      - name: Export web bundle
        run: npm run build:web

      - name: Install headless browser
        run: node scripts/retry-infrastructure.mjs -- npx playwright install --with-deps chromium

      - name: Exercise exported SQLite app
        run: npm run test:e2e:export

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: expo-app/artifacts/
          retention-days: 14

  visual-windows:
    name: Compare reviewed Windows screenshots
    runs-on: windows-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_NO_DOTENV: '1'
      DROPS_E2E_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: expo-app/.nvmrc
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: node scripts/retry-infrastructure.mjs -- npm ci
      - run: npm run build:web
      - run: node scripts/retry-infrastructure.mjs -- npx playwright install chromium
      - name: Run reviewed visual comparisons
        run: node scripts/run-browser-tests.mjs --visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence-${{ github.sha }}
          path: expo-app/artifacts/
          retention-days: 14

  native-bundle:
    name: Export native JS bundles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: expo-app/.nvmrc
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install dependencies
        run: node scripts/retry-infrastructure.mjs -- npm ci

      - name: Export native bundles
        run: npm run build:native
